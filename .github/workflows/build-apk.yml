name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate Project Root & Setup Keystore
        run: |
          # Detect if project is at root or inside a subfolder (e.g. from extracted zip)
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            PROJECT_DIR="."
          else
            FOUND=$(find . -maxdepth 2 -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            else
              PROJECT_DIR="."
            fi
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project directory is: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f .env ]; then
            touch .env
          fi

          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Locate and Collect APK
        run: |
          mkdir -p build-apks
          APK_PATH=$(find . -name "*.apk" | grep -E "debug|app" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" build-apks/ConnectCode-MSChat-debug.apk
            echo "Successfully found and copied APK: $APK_PATH"
          else
            echo "Searching all APK files..."
            find . -name "*.apk" -exec cp {} build-apks/ConnectCode-MSChat-debug.apk \;
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConnectCode-MSChat-APK
          path: build-apks/*.apk
          retention-days: 30
