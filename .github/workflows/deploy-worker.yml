name: Deploy Worker Proxy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (if uploaded as a zip)
        run: |
          if [ -f msa-to-full-mark.zip ]; then
            unzip -o msa-to-full-mark.zip -d .
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set Gemini secret on the Worker
        working-directory: msa-to-full-mark/cloudflare-worker
        run: echo "${{ secrets.GEMINI_API_KEY }}" | npx wrangler secret put GEMINI_API_KEY

      - name: Deploy Worker
        working-directory: msa-to-full-mark/cloudflare-worker
        run: npx wrangler deploy
